syntax = "proto3";

package chat;

option go_package = "github.com/tomba07/bombshell/proto/chat";

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_CHAT = 1;
  EVENT_TYPE_PLAYER_JOINED = 2;
  EVENT_TYPE_PLAYER_LEFT = 3;
  EVENT_TYPE_MOVE = 4;
  EVENT_TYPE_TRAP_PLACED = 5;
  EVENT_TYPE_TRAP_TRIGGERED = 6;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_UP = 1;
  DIRECTION_DOWN = 2;
  DIRECTION_LEFT = 3;
  DIRECTION_RIGHT = 4;
}

service ChatService {
  rpc Join(JoinRequest) returns (JoinResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc PlaceTrap(PlaceTrapRequest) returns (PlaceTrapResponse);
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message Event {
  EventType type = 1;
  string player_id = 2;
  string message = 3;
  Direction direction = 4;
  int32 x = 5;
  int32 y = 6;
}

message JoinRequest {
  string name = 1;
}

message JoinResponse {
  string player_id = 1;
  int32 width = 2;
  int32 height = 3;
}

message SendMessageRequest {
  string player_id = 1;
  string message = 2;
}

message SendMessageResponse {
  bool ok = 1;
}

message LeaveRequest {
  string player_id = 1;
}

message LeaveResponse {
  bool ok = 1;
}

message SubscribeRequest {
  string player_id = 1;
}

message MoveRequest {
  string player_id = 1;
  Direction direction = 2;
}

message MoveResponse {
  bool ok = 1;
}

message PlaceTrapRequest {
  string player_id = 1;
}

message PlaceTrapResponse {
  bool ok = 1;
}
